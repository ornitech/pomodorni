name: Build and Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (tag: $GITHUB_REF_NAME)"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Extract the signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "Signing identity: $IDENTITY"
        id: cert

      - name: Build and create DMG
        run: make dmg VERSION=${{ steps.version.outputs.version }} SIGNING_IDENTITY="${{ steps.cert.outputs.identity }}"

      - name: Notarize DMG
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8" > "$KEY_PATH"

          echo "Submitting for notarization..."
          xcrun notarytool submit ".build/Pomodorni.dmg" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --key "$KEY_PATH" \
            --wait \
            --timeout 10m \
            2>&1 | tee /tmp/notarize-output.txt

          if grep -q "status: Invalid" /tmp/notarize-output.txt; then
            echo "Notarization failed. Fetching log..."
            SUBMISSION_ID=$(grep "id:" /tmp/notarize-output.txt | head -1 | awk '{print $2}')
            xcrun notarytool log "$SUBMISSION_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --key "$KEY_PATH"
            rm "$KEY_PATH"
            exit 1
          fi

          if ! grep -q "status: Accepted" /tmp/notarize-output.txt; then
            echo "Notarization did not succeed. Output:"
            cat /tmp/notarize-output.txt
            rm "$KEY_PATH"
            exit 1
          fi

          xcrun stapler staple ".build/Pomodorni.dmg"
          rm "$KEY_PATH"
          echo "Notarization and stapling complete"

      - name: Download Sparkle tools
        id: sparkle-tools
        run: |
          SPARKLE_VERSION=$(python3 -c "
          import json
          with open('Package.resolved') as f:
              data = json.load(f)
          for pin in data.get('pins', []):
              if 'sparkle' in pin.get('identity', '').lower():
                  state = pin.get('state', {})
                  print(state.get('version', '2.6.4'))
                  break
          else:
              print('2.6.4')
          ")
          echo "Sparkle version: $SPARKLE_VERSION"

          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle && tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          chmod +x /tmp/sparkle/bin/sign_update
          echo "tool_path=/tmp/sparkle/bin/sign_update" >> "$GITHUB_OUTPUT"

      - name: Sign DMG with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        id: sign
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No Sparkle private key set, skipping signing"
            exit 0
          fi
          RAW_OUTPUT=$("${{ steps.sparkle-tools.outputs.tool_path }}" ".build/Pomodorni.dmg" -f <(echo "$SPARKLE_PRIVATE_KEY"))
          ED_SIGNATURE=$(echo "$RAW_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//')
          echo "signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "DMG signed successfully"

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
              echo "Release found"
              exit 0
            fi
            echo "Waiting for release... (attempt $i/30)"
            sleep 2
          done
          echo "Release not found after 60s"
          exit 1

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" ".build/Pomodorni.dmg" --clobber

      - name: Update appcast on gh-pages
        if: steps.sign.outputs.signature != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          DMG_SIZE=$(stat -f%z .build/Pomodorni.dmg)
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Pomodorni.dmg"

          git worktree remove /tmp/gh-pages 2>/dev/null || true
          rm -rf /tmp/gh-pages

          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            cd /tmp/gh-pages
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd -
          fi

          export VERSION DATE DOWNLOAD_URL SIGNATURE DMG_SIZE

          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import os

          appcast_path = "/tmp/gh-pages/appcast.xml"
          ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          ET.register_namespace("sparkle", ns)

          version = os.environ["VERSION"]
          date = os.environ["DATE"]
          url = os.environ["DOWNLOAD_URL"]
          sig = os.environ["SIGNATURE"]
          size = os.environ["DMG_SIZE"]

          if os.path.exists(appcast_path):
              with open(appcast_path, "r") as f:
                  xml_str = f.read()
              if "xmlns:sparkle" not in xml_str:
                  xml_str = xml_str.replace('<rss ', f'<rss xmlns:sparkle="{ns}" ', 1)
              root = ET.fromstring(xml_str)
              tree = ET.ElementTree(root)
              channel = root.find("channel")
          else:
              root = ET.fromstring(
                  f'<rss version="2.0" xmlns:sparkle="{ns}">'
                  f'<channel><title>Pomodorni Updates</title></channel>'
                  f'</rss>'
              )
              tree = ET.ElementTree(root)
              channel = root.find("channel")

          item = ET.SubElement(channel, "item")
          ET.SubElement(item, "title").text = f"Version {version}"
          ET.SubElement(item, "pubDate").text = date
          ET.SubElement(item, "sparkle:version").text = version
          enclosure = ET.SubElement(item, "enclosure")
          enclosure.set("url", url)
          enclosure.set("sparkle:edSignature", sig)
          enclosure.set("length", size)
          enclosure.set("type", "application/octet-stream")

          tree.write(appcast_path, xml_declaration=True, encoding="utf-8")
          PYEOF

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for ${TAG}"
          git push origin HEAD:gh-pages
          cd -
          git worktree remove /tmp/gh-pages

      - name: Notify Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "No Homebrew tap token set, skipping"
            exit 0
          fi
          DMG_SHA256=$(shasum -a 256 .build/Pomodorni.dmg | awk '{print $1}')
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            "https://api.github.com/repos/ornitech/homebrew-tap/dispatches" \
            -d "{
              \"event_type\": \"update-cask\",
              \"client_payload\": {
                \"version\": \"${{ steps.version.outputs.version }}\",
                \"tag\": \"${{ steps.version.outputs.tag }}\",
                \"sha256\": \"$DMG_SHA256\",
                \"url\": \"https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Pomodorni.dmg\"
              }
            }"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "${{ steps.cert.outputs.keychain_path }}" 2>/dev/null || true
